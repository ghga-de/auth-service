[project]
name = "auth_service"
version = "10.0.2"
description = "Authentication adapter and services used for the GHGA data portal"
dependencies = [
    "ghga-event-schemas~=13.0.0",
    "ghga-service-commons[api,auth]>=8,<9",
    "hexkit[mongodb,akafka,opentelemetry-akafka,opentelemetry-mongodb,opentelemetry-fastapi]>=9, <10",
    "pynacl>=1.6,<2",
    "pyotp>=2.9,<3",
    "httpx2>=2.9.1,<3",
    "phonenumbers>=9,<10",
]

[project.urls]
Repository = "https://github.com/ghga-de/auth-service"

[project.scripts]
auth-service = "auth_service.__main__:run"

[tool.pytest.ini_options]
# the unit tests should always run before the integration tests
testpaths = [
    "tests/unit",
    "tests/integration"
]
